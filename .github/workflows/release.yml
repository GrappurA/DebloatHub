name: Release

# Push a tag like v1.2.0 to publish a release:
#   1. set $AppVersion='1.2.0' in DebloatHub.ps1 and add a "## [1.2.0] - date" section to CHANGELOG.md
#   2. git tag v1.2.0 && git push origin v1.2.0
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check that the script version matches the tag
        run: |
          ver="${GITHUB_REF_NAME#v}"
          if ! grep -q "^\$AppVersion='${ver}'" DebloatHub.ps1; then
            echo "::error::DebloatHub.ps1 \$AppVersion is not '${ver}' (tag ${GITHUB_REF_NAME})"; exit 1
          fi

      - name: Build DebloatHub.zip
        run: |
          mkdir -p dist/DebloatHub
          cp DebloatHub.ps1 "Start DebloatHub.bat" dist/DebloatHub/
          sed "s/{{VERSION}}/${GITHUB_REF_NAME}/" release/README.txt > dist/DebloatHub/README.txt
          if [ -f LICENSE ]; then cp LICENSE dist/DebloatHub/; fi
          (cd dist && zip -r -X -9 DebloatHub.zip DebloatHub)
          cp DebloatHub.ps1 dist/DebloatHub.ps1
          (cd dist && sha256sum DebloatHub.zip DebloatHub.ps1 > SHA256SUMS.txt && cat SHA256SUMS.txt)

      - name: Release notes (installation first, then changes from CHANGELOG.md)
        run: |
          ver="${GITHUB_REF_NAME#v}"
          awk -v h="## [${ver}]" 'index($0,"## ")==1{p=(index($0,h)==1);next} p' CHANGELOG.md > changes.md
          if [ ! -s changes.md ]; then echo "::error::CHANGELOG.md has no '## [${ver}]' section"; exit 1; fi
          {
            echo "## Installation"
            echo ""
            echo "1. Download **DebloatHub.zip** from *Assets* below."
            echo "2. Extract the whole zip to a folder (do not run it from inside the zip)."
            echo "3. Double-click **Start DebloatHub.bat** and click **Yes** when Windows asks for administrator rights."
            echo "4. Wait for the first scan, choose your tweaks (hover a switch for details) and press **Apply**. Keep *Restore point first* on."
            echo ""
            echo "> **\"Windows protected your PC\"?** The script is not code-signed. Click **More info > Run anyway**, or before extracting right-click the zip > **Properties** > tick **Unblock**."
            echo ""
            echo "**Requirements:** Windows 10 or 11 (64-bit), administrator rights. Nothing to install: DebloatHub is portable."
            echo ""
            echo "**Updating:** replace the old files with the new ones; your undo records are kept."
            echo ""
            echo "<details><summary>PowerShell one-liner instead of the zip</summary>"
            echo ""
            echo '```powershell'
            echo '[Net.ServicePointManager]::SecurityProtocol="Tls12"; $p="$env:TEMP\DebloatHub.ps1"; irm https://github.com/GrappurA/DebloatHub/releases/latest/download/DebloatHub.ps1 -OutFile $p; powershell -NoProfile -ExecutionPolicy Bypass -File $p'
            echo '```'
            echo "</details>"
            echo ""
            echo "## What's new in ${GITHUB_REF_NAME}"
            cat changes.md
            echo ""
            echo "---"
            echo "\`SHA256SUMS.txt\` lists the checksums of the files. Full documentation: [README](https://github.com/GrappurA/DebloatHub#readme)"
          } > notes.md

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/DebloatHub.zip dist/DebloatHub.ps1 dist/SHA256SUMS.txt \
            --title "DebloatHub ${GITHUB_REF_NAME}" --notes-file notes.md --verify-tag
